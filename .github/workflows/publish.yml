name: Publish

# Publishes to PyPI on a GitHub release, via Trusted Publishing.
#
# Trusted Publishing rather than an API token, for one reason that matters
# more than convenience: there is no secret. PyPI verifies a short-lived
# OIDC token minted by GitHub for this repository and this workflow file,
# so there is nothing to leak, rotate, or accidentally print in a log. A
# long-lived `PYPI_API_TOKEN` repo secret is a credential that outlives
# every person who remembers creating it.
#
# One-time setup on PyPI (Your projects -> Publishing, or the "pending
# publisher" form for a project that does not exist yet):
#
#     PyPI project name:  demotape
#     Owner:              LibruaryNFT
#     Repository name:    demotape
#     Workflow name:      publish.yml
#     Environment name:   pypi
#
# Those five values must match exactly or PyPI rejects the token. In
# particular the workflow filename and the environment name below are part
# of the identity being verified — renaming either breaks publishing until
# the publisher is updated to match.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # twine check catches the metadata problems PyPI rejects on upload —
      # a malformed long_description being the usual one. Better to fail
      # here than half way through a release.
      - name: Check metadata
        run: python -m twine check dist/*

      # Install the artefact rather than the source tree. A wheel that
      # builds is not a wheel that imports: a missing package in
      # `packages.find`, or a module left out of the manifest, only shows
      # up when something installs the built file.
      - name: Import the built wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "
          import demotape
          from demotape import ProjectConfig, Scene, render, Capture, SceneTiming
          print('version', demotape.__version__, '|', len(demotape.__all__), 'public names')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment is half of the Trusted Publishing identity, and it is
    # also where a manual approval gate would go if releases ever want one.
    environment:
      name: pypi
      url: https://pypi.org/p/demotape
    permissions:
      # Mints the OIDC token PyPI checks. This is the entire credential.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
